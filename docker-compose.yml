services:
  postgres:
    image: postgres:16-alpine
    container_name: vinverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vinverse_publication
    ports:
      - "5432:5432"
    volumes:
      - vinverse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vinverse_publication"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vinverse_postgres_data:
