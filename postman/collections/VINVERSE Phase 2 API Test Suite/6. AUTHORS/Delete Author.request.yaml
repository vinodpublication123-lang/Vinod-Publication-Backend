$kind: http-request
url: "{{baseUrl}}/authors/{{authorId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{adminAccessToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status code is 200 or 409', function () { pm.expect(pm.response.code).to.be.oneOf([200, 409]); });
    language: text/javascript
order: 4000
