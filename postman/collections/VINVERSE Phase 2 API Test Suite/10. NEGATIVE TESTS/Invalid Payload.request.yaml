$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
body:
  type: json
  content: |-
    {
      "email": "invalid-email"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status code is 400', function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 3000
