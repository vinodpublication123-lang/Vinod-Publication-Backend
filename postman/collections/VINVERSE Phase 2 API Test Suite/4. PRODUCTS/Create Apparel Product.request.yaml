$kind: http-request
url: "{{baseUrl}}/products"
method: POST
body:
  type: json
  content: |-
    {
      "name": "VINVERSE T-Shirt",
      "sku": "TSHIRT-01",
      "category": "APPAREL",
      "price": 29.99,
      "sizes": [
        {
          "label": "SMALL",
          "stock": 10
        },
        {
          "label": "MEDIUM",
          "stock": 15
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{adminAccessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 20X', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 204]);
      });
      pm.test('Success is true', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.be.true;
      });
      var jsonData = pm.response.json();
      pm.environment.set('apparelProductId', jsonData.data.id);
      pm.test('Apparel sizes persist', function() { pm.expect(jsonData.data.sizes.length).to.eql(2); });
    language: text/javascript
order: 1000
