$kind: http-request
name: "[NEG] Customer access /admin/orders — 403"
url: "{{baseUrl}}/admin/orders"
method: GET
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: pm.test('403 Forbidden', function() { pm.response.to.have.status(403); });
    language: text/javascript
order: 5000
