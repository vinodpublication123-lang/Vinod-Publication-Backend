$kind: http-request
url: "{{baseUrl}}/admin/orders/{{orderId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "PENDING"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminAccessToken}}"
scripts:
  - type: afterResponse
    code: pm.test('409 invalid transition', function() { pm.response.to.have.status(409); });
    language: text/javascript
order: 6000
