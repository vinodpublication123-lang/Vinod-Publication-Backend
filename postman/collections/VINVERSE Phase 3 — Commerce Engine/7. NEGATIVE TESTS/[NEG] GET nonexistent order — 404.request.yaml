$kind: http-request
url: "{{baseUrl}}/orders/cm000000000000000000000002"
method: GET
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: pm.test('404 not found', function() { pm.response.to.have.status(404); });
    language: text/javascript
order: 8000
