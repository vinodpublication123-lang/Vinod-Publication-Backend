$kind: http-request
url: "{{baseUrl}}/uploads/audio"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: file
      value: ""
scripts:
  - type: afterResponse
    code: pm.test('401 audio no auth', function() { pm.response.to.have.status(401); });
    language: text/javascript
order: 4000
