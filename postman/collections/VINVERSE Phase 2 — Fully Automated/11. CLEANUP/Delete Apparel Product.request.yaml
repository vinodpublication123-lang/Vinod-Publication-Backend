$kind: http-request
url: "{{baseUrl}}/products/{{apparelProductId}}"
method: DELETE
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{adminAccessToken}}"
scripts:
  - type: afterResponse
    code: pm.test('apparel product deleted', () => pm.expect(pm.response.code).to.be.oneOf([200,201,204]));
    language: text/javascript
order: 3000
