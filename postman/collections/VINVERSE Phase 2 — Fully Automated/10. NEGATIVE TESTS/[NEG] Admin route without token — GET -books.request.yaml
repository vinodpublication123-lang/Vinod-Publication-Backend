$kind: http-request
name: "[NEG] Admin route without token — GET /books"
url: "{{baseUrl}}/books"
method: GET
headers:
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
    language: text/javascript
order: 6000
